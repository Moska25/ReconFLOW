<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="ReconFLOW: two ledger columns brought level">
  <rect width="32" height="32" rx="7" fill="#0b0d10"/>
  <!-- Two columns of a ledger, one short, one long, ruled and brought level:
       the whole product in one mark. -->
  <g fill="#14b8a6">
    <rect x="7" y="9"  width="7" height="3" rx="1.5"/>
    <rect x="7" y="15" width="7" height="3" rx="1.5"/>
    <rect x="7" y="21" width="7" height="3" rx="1.5"/>
  </g>
  <g fill="#14b8a6" opacity="0.45">
    <rect x="18" y="9"  width="7" height="3" rx="1.5"/>
    <rect x="18" y="15" width="7" height="3" rx="1.5"/>
    <rect x="18" y="21" width="7" height="3" rx="1.5"/>
  </g>
  <rect x="15.4" y="7" width="1.2" height="19" rx="0.6" fill="#e6e9ef" opacity="0.65"/>
</svg>
